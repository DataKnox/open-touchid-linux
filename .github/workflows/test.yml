name: test

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Compile
        run: python3 -m compileall -q src tests
      - name: Test
        run: python3 -m unittest discover -s tests -v
